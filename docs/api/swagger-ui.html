        "enum": [

        "enum": [
          "20000",
          "40000",
          "40100",
          "40101",
          "40102",
          "40103",
          "40300",
          "40301",
          "41000",
          "41001",
          "42900"
        ],
        "x-enum-varnames": [
          "SUCCESS",
          "ERROR",
          "UNAUTHORIZED",
          "TOKEN_EXPIRED",
          "TOKEN_INVALID",
          "LOGIN_ENV_CHANGED",
          "FORBIDDEN",
          "USER_DISABLED",
          "PARAM_EMPTY",
          "VERIFY_CODE_INVALID",
          "LOGIN_TOO_MANY_ATTEMPTS"
        ],

          "系统错误",
          "用户未登录",

          "登录环境变化，请重新登录",
          "没有权限",
          "用户已禁用，无法登录",
          "参数校验错误",
