openapi: 3.1.0
info:
  title: 咖啡点单系统 API
  description: '已实现接口已从后端 FastAPI 同步（路径、入参、出参以后端代码为准）。

    有改动的接口看路径**右侧摘要**（例如「原 /staff → /admins」）；已下线接口在底部「已删除」分组。对照页 `/plans/round-diff`。


    - **网页端** `web`：`/api/web/super-admin/*` · `/api/web/admin/*`

    - **小程序端** `mp`：`/api/mp/customer/*`

    - **系统**：`/api/system/*`

    - HTTP 恒为 200；业务成败只看 body 的 `code` / `is_success`

    - 业务码：成功 `0`；系统错误 `40000`；未登录 `40100`；Token过期 `40101`；Token无效 `40102`；登录环境变化 `40103`；无权限 `40300`；用户禁用 `40301`；资源不存在 `40400`；参数错误
    `41000`；验证码错误 `41001`；登录过于频繁 `42900`

    - 枚举与权限见 `/plans/enums`。卡券分组：`web-super-admin-coupons`、`mp-customer-coupons`

    - **管理端权限**：`/api/web/admin/*` 默认超管与分店管理员均可（分店仅本店）；`/api/web/super-admin/*` 仅超管

    - 每个接口展开区含「前端页面 / 展示内容 / 调用示例」

    '
