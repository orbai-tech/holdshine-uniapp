      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StoreId:
      name: store_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OptionalStoreId:
      name: store_id
      in: query
      description: 超管可传；店长忽略或强制本店
      schema:
        type: integer
        format: int64
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FileKey:
      name: file_key
      in: path
      required: true
      schema:
        type: string
  schemas:
    StoreStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      description: 营业 / 打烊
    ShelfStatus:
      type: string
      enum:
      - 'ON'
      - 'OFF'
    AdminRole:
      type: string
      enum:
      - SUPER_ADMIN
      - STORE_ADMIN
    MpRole:
      type: string
      enum:
      - CUSTOMER
      - STAFF
    ProductType:
      type: string
      enum:
      - MENU
      - MALL
    OrderType:
      type: string
      enum:
      - DINE_IN
      - TAKEOUT
      - MALL
      description: 堂食 / 外卖(预留) / 商城
    OrderStatus:
      type: string
      enum:
      - PENDING_PAY
      - PENDING_ACCEPT
      - MAKING
      - READY
      - DELIVERING
      - COMPLETED
      - CANCELLED
      - REFUNDING
      - REFUNDED
    CouponRuleType:
      type: string
      enum:
      - FULL_REDUCE
      - DISCOUNT
      description: 满减 / 折扣
    BusinessCode:
      type: string
      description: 业务状态码（写在 JSON body.code，不是 HTTP Status）。成功为 0；错误码见 HttpErrorCodeEnum。
      enum:
      - '0'
      - '40000'
      - '40100'
      - '40101'
      - '40102'
      - '40103'
      - '40300'
      - '40301'
      - '40400'
      - '41000'
      - '41001'
      - '42900'
      x-enum-varnames:
      - SUCCESS
      - ERROR
      - UNAUTHORIZED
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - LOGIN_ENV_CHANGED
      - FORBIDDEN
      - USER_DISABLED
      - PARAM_EMPTY
      - VERIFY_CODE_INVALID
      - LOGIN_TOO_MANY_ATTEMPTS
      x-enum-descriptions:
      - 成功
      - 系统错误
      - 用户未登录
      - 登录已过期，请重新登录
      - 登录信息无效，请重新登录
      - 登录环境变化，请重新登录
      - 没有权限
      - 用户已禁用，无法登录
      - 参数校验错误
      - 验证码错误或已过期
      - 登录尝试过于频繁，请稍后再试
    ApiResponseBase:
      type: object
      required:
      - code
      - is_success
      - message
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/BusinessCode'
          description: 业务状态码（非 HTTP）。成功为 0。
          example: '0'
        is_success:
          type: boolean
          description: true 表示业务成功（通常 code=0）；false 表示业务失败
          example: true
        message:
          type: string
          example: 成功
    ApiResponseFail:
      allOf:
      - $ref: '#/components/schemas/ApiResponseBase'
      - type: object
        description: 业务失败示例（HTTP 仍为 200）
        properties:
          code:
            allOf:
            - $ref: '#/components/schemas/BusinessCode'
            example: '40000'
          is_success:
            type: boolean
